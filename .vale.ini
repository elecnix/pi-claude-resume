# Vale prose configuration.
#
# Only the built-in `Vale` style is used, so no `vale sync` and no network access are required:
# the rules ship with the Vale release itself, and CI needs nothing beyond the pinned binary.
# Project vocabulary lives in .github/styles/config/vocabularies/ClaudeResume/accept.txt.
StylesPath = .github/styles
MinAlertLevel = warning

Vocab = ClaudeResume

[*.md]
BasedOnStyles = Vale

# Keep the spelling rule at its default error level: a typo in documentation fails the check.
# A word the dictionary does not know is added to the vocabulary instead of silencing the rule.
#
# Vale.Terms enforces the house capitalization of product names, and this project writes the
# package as `pi-claude-resume` — lowercase, because that is the name npm and pi use — and the
# tools as `pi` and `Claude Code`. The rule would rewrite them, so it is off.
Vale.Terms = NO
